<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- Reine Testdatei: darf nicht in den Suchindex -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[OHNE STATISTIK] Walter Pepperle — Illustration &amp; Packungsdesign</title>
  <meta name="description" content="Walter Pepperle, Frankfurt am Main — Illustration, Grafik-Design und Packungsdesign. Portfolio mit Arbeiten aus Food, Werbung, Pharma, Verpackung und mehr.">
  <meta property="og:title" content="Walter Pepperle — Illustration &amp; Packungsdesign">
  <meta property="og:description" content="Illustration, Grafik-Design und Packungsdesign aus Frankfurt am Main.">
  <meta property="og:type" content="website">
  <!-- Nach dem DNS-Umzug auf https://www.pepperle.de/assets/og-image.png umstellen -->
  <meta property="og:image" content="https://superevilgoat.github.io/pepperle-grafikdesign/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="1200">
  <meta property="og:image:alt" content="Walter Pepperle — Logo">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#05325c">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div style="position:fixed;z-index:99;top:0;left:0;right:0;padding:6px;background:#ea4f43;color:#fff;font:11px/1.4 monospace;text-align:center;">DIAGNOSE-SEITE — ohne Statistik-Skript</div>
  <div id="stage">
    <div class="glow"></div>

    <div id="drift" aria-hidden="true"></div>

    <div class="vignette"></div>

    <div class="om-logo">
      <svg viewBox="0 0 3543 1417" role="img" aria-label="Pepperle — Logo">
        <polygon points="1606,75 2612,1307 595,1307" fill="#ea4f43"></polygon>
        <image href="assets/signature-full.png" x="0" y="0" width="3543" height="1417"></image>
      </svg>
    </div>

    <p class="om-tag" id="tagline"></p>

    <div id="lightbox" hidden>
      <div class="lb-inner">
        <img id="lbImg" alt="">
        <p class="lb-title" id="lbTitle"></p>
      </div>
      <button type="button" class="lb-close" aria-label="Schließen">×</button>
    </div>

    <div class="topbar">
      <button type="button" class="contact-btn" id="contactBtn"></button>
    </div>

    <div id="sheetModal" hidden>
      <div class="sheet-inner" id="sheetInner"></div>
    </div>

    <div id="legalModal" hidden>
      <div class="legal-card">
        <button type="button" class="legal-close" id="legalClose" aria-label="Schließen">×</button>
        <h2>Impressum</h2>
        <div id="legalBlocks"></div>
      </div>
    </div>

    <div id="contactModal" hidden>
      <div class="contact-card">
        <button type="button" class="contact-close" id="contactClose" aria-label="Schließen">×</button>
        <h2 id="contactTitle"></h2>
        <p class="form-note" id="contactNote"></p>
        <p class="thanks" id="thanks" hidden></p>
        <form id="contactForm">
          <input type="text" id="fName" name="name" required>
          <input type="email" id="fMail" name="email" required>
          <textarea id="fMsg" name="message" rows="4" required></textarea>
          <button type="submit" id="fSend"></button>
        </form>
      </div>
    </div>

    <div class="bottom">
      <div class="hint-wrap"><span id="hint"></span></div>
      <p class="note" id="note"></p>
      <nav class="cats-nav" id="catsNav"></nav>
      <div id="mobileNav" hidden></div>
    </div>
  </div>

  <noscript>
    <div style="position:fixed;inset:0;background:#05325c;color:#eef3f8;font-family:Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;">
      <p>Walter Pepperle — Illustration &amp; Packungsdesign, Frankfurt am Main.<br>
      Diese Seite benötigt JavaScript.<br>
      Kontakt: <a href="mailto:info@pepperle.de" style="color:#ea4f43;">info@pepperle.de</a></p>
    </div>
  </noscript>

  <script src="js/data.js"></script>
  <script src="js/legal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
