<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weiterleitung — Walter Pepperle</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#05325c">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/page.css">
  <script>
    // Reiner Weiterleitungs-Link für den Dateiaustausch: hält die für Empfänger
    // sichtbare/geklickte Domain bei pepperle.de (bessere Zustellbarkeit als ein
    // roher *.workers.dev-Link in der Mail), leitet dann zur eigentlichen,
    // dynamischen Freigabeseite im Worker weiter. Siehe DNS-Umzug.md Phase 1 —
    // ein echter Custom Domain für den Worker geht ohne vollen Nameserver-
    // Wechsel nicht, das hier ist der kostenlose Ersatz dafür.
    var WORKER_ORIGIN = "https://pepperle-analytics.a347157.workers.dev";
    var params = new URLSearchParams(location.search);
    var token = params.get("t");
    if (token) {
      location.replace(WORKER_ORIGIN + "/share/" + encodeURIComponent(token));
    }
  </script>
</head>
<body>
  <header class="pg-head">
    <a class="pg-logo" href="/" aria-label="Walter Pepperle — Startseite"><svg viewBox="0 0 3543 1417" role="img" aria-label="Walter Pepperle — Logo">
        <polygon points="1606,75 2612,1307 595,1307" fill="#ea4f43"></polygon>
        <image href="/assets/signature-720.png" x="0" y="0" width="3543" height="1417"></image>
      </svg></a>
  </header>
  <main id="inhalt" class="pg-404">
    <h1>Weiterleitung …</h1>
    <p id="msg">Sie werden zur Freigabeseite weitergeleitet.</p>
    <p id="fallback" style="display:none">
      Falls die Weiterleitung nicht automatisch startet:
      <a id="fallback-link" class="pg-back" href="#">Zur Freigabeseite</a>
    </p>
  </main>
  <script>
    if (!token) {
      document.getElementById("msg").textContent = "Dieser Link ist unvollständig.";
    } else {
      var target = WORKER_ORIGIN + "/share/" + encodeURIComponent(token);
      var link = document.getElementById("fallback-link");
      link.href = target;
      document.getElementById("fallback").style.display = "block";
    }
  </script>
</body>
</html>
